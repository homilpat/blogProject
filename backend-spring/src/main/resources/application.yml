server:
  port: 8080

spring:
  application:
    name: manufacturing-knowledge-blog-backend
  datasource:
    url: 
    username: 
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

uploads:
  directory: ${UPLOADS_DIRECTORY:./uploads}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.knowledge.blog.model
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

rag:
  fastapi-url: ${RAG_FASTAPI_URL}

security:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS}
  admin:
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

logging:
  level:
    com.knowledge.blog.mapper: DEBUG
